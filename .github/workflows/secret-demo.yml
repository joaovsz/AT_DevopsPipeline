name: Secret Demo

on:
  push:

jobs:
  validate-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Validar secret sem expor valor
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "API_KEY nao configurado"
            exit 1
          fi
          echo "::add-mask::$API_KEY"
          echo "API_KEY configurado"
